[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "No fixed upgrade is available; rsa is pulled transitively via jsonwebtoken/restate. Revisit when upstream releases a fix." },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",

  "0BSD",
  "Zlib",
]
# Build-time only: reached through const-random-macro, a proc-macro in the
# OpenDAL S3/GCS signer stack, so it is never linked into a shipped artifact.
exceptions = [
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
