[package]
name = "email-transport-test"
version = { workspace = true }
description = "First-party test transports and conformance helpers for email-transport"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["email", "transport", "testing"]
categories = ["email", "development-tools::testing"]
publish = false

[features]
default = []
conformance = ["dep:time"]

[dependencies]
email-message = { workspace = true }
email-message-wire = { workspace = true }
email-transport = { workspace = true }

time = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.release]
release = false
