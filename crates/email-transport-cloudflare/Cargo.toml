[package]
name = "email-transport-cloudflare"
version = { workspace = true }
description = "Cloudflare Workers send_email transport implementation for email-transport"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["email", "cloudflare", "workers", "wasm"]
categories = ["email", "network-programming", "wasm"]

[dependencies]
email-message = { workspace = true }
email-transport = { workspace = true }

wasm-bindgen = "0.2"
worker = { version = "0.8.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
email-message = { workspace = true, features = ["mime"] }
email-transport-test = { workspace = true, features = ["conformance"] }

time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
