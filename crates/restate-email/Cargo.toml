[package]
name = "restate-email"
version = { workspace = true }
description = "Restate email worker contracts and service adapter"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["email", "worker", "restate", "queue"]
categories = ["email", "asynchronous"]

[features]
default = ["service"]
# Caller-side transport for invoking the email service through Restate ingress.
client = ["dep:reqwest", "reqwest/default", "reqwest/json"]
# Provider-option deserialization is delegated to email-kit.
resend = ["email-kit/transport-resend", "service"]
# Derive JSON Schema for public queue payload types.
schemars = [
    "dep:schemars",
    "email-message/schemars",
    "email-transport/schemars",
    "restate-sdk?/schemars",
]
# Restate worker service adapter and transport registry.
service = ["dep:bytes", "dep:email-kit", "dep:restate-sdk", "dep:serde_path_to_error"]
# Forward email-message's RFC 5322 string address compatibility into queue schemas.
rfc5322-string-compat = ["email-message/rfc5322-string-compat"]

[dependencies]
bytes = { version = "1", optional = true }
email-kit = { workspace = true, features = ["serde"], optional = true }
email-message = { workspace = true, features = ["serde"] }
email-transport = { workspace = true, features = ["serde"] }

reqwest = { workspace = true, default-features = false, optional = true }
restate-sdk = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
email-message = { workspace = true, features = ["mime", "serde"] }
email-transport-resend = { workspace = true }
http = "1"
http-body-util = "0.1"
prost = "0.14"
reqwest = { workspace = true, features = ["json"], default-features = false }
restate-sdk-shared-core = "7.0"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6"

[[example]]
name = "direct_or_restate"
required-features = ["client"]

[[example]]
name = "invoke_local_worker"
required-features = ["client"]

[[example]]
name = "restate_email_worker"
required-features = ["service"]

[[example]]
name = "restate_resend_worker"
required-features = ["resend"]

# Build docs with every compatible public API feature enabled.
[package.metadata.docs.rs]
all-features = true
