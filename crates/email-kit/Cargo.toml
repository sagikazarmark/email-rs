[package]
name = "email-kit"
version = { workspace = true }
description = "Convenience facade for the email-rs crates"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[features]
default = [
    "email-message/default",
    "email-transport/default",
    "email-transport-resend?/default",
]
arbitrary = ["email-message/arbitrary"]
schemars = ["email-message/schemars", "email-transport/schemars"]
serde = [
    "email-message/serde",
    "email-transport/serde",
    "email-transport-resend?/serde",
]
tracing = ["email-transport/tracing"]
transport-all = ["transport-resend"]
transport-resend = ["dep:email-transport-resend"]
wire = ["dep:email-message-wire"]

[dependencies]
email-message = { workspace = true, default-features = false }
email-message-wire = { workspace = true, default-features = false, optional = true }
email-transport = { workspace = true, default-features = false }
email-transport-resend = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

# Build docs with every compatible public API feature enabled.
[package.metadata.docs.rs]
all-features = true
