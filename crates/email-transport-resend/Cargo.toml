[package]
name = "email-transport-resend"
version = { workspace = true }
description = "Resend transport implementation for email-transport"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["email", "resend", "transactional"]
categories = ["email", "network-programming"]

[features]
default = ["reqwest/default", "serde"]
serde = ["email-transport/serde"]

[dependencies]
email-message = { workspace = true }
email-transport = { workspace = true }
resend-rs = { version = "0.26", default-features = false }

reqwest = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
email-transport-test = { workspace = true, features = ["conformance"] }

time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
wiremock = "0.6"

[[example]]
name = "resend_send"
