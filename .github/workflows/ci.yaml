name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Run tests (default features)
        run: cargo test --workspace --locked

      - name: Run tests (all features)
        run: cargo test --workspace --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Check MSRV
        run: rustup run 1.92.0 cargo check --workspace --all-targets --locked

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Test (no default features)
        shell: bash
        run: |
          set -euo pipefail

          for package in \
            email-attachment \
            email-attachment-opendal \
            email-kit \
            email-message \
            email-message-wire \
            email-transport \
            email-transport-cloudflare \
            email-transport-lettre \
            email-transport-resend \
            email-transport-restate \
            email-transport-test \
            restate-email
          do
            echo "==> cargo test -p $package --no-default-features"
            cargo test -p "$package" --no-default-features --locked
          done

      - name: Test (single features)
        shell: bash
        run: |
          set -euo pipefail

          for package_feature in \
            email-attachment-opendal/services-memory \
            email-kit/attachment-opendal \
            email-kit/serde \
            email-kit/schemars \
            email-kit/arbitrary \
            email-kit/tracing \
            email-kit/transport-all \
            email-kit/transport-all-wasm \
            email-kit/transport-cloudflare \
            email-kit/transport-lettre \
            email-kit/transport-resend \
            email-kit/wire \
            email-message/mime \
            email-message/serde \
            email-message/schemars \
            email-message/arbitrary \
            email-message/rfc5322-string-compat \
            email-transport/serde \
            email-transport/schemars \
            email-transport/tracing \
            email-transport-lettre/native-tls \
            email-transport-lettre/pool \
            email-transport-lettre/rustls-tls \
            email-transport-resend/serde \
            email-transport-restate/schemars \
            email-transport-test/conformance \
            restate-email/transport-resend \
            restate-email/rfc5322-string-compat \
            restate-email/schemars \
            restate-email-endpoint/transport-all
          do
            package="${package_feature%%/*}"
            feature="${package_feature#*/}"

            echo "==> cargo test -p $package --no-default-features --features $feature"
            cargo test -p "$package" --no-default-features --features "$feature" --locked
          done

      - name: Test additive feature combinations
        run: cargo test -p email-transport-resend --all-targets --no-default-features --features email-transport/serde --locked

  wasm:
    name: Wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Install Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check Wasm packages
        run: |
          cargo check -p email-message-wire --target wasm32-unknown-unknown --locked
          cargo check -p email-transport-cloudflare --target wasm32-unknown-unknown --locked
          cargo check -p email-transport-resend --target wasm32-unknown-unknown --locked
          cargo check -p email-transport-restate --target wasm32-unknown-unknown --locked
          cargo check -p email-kit --features transport-all-wasm --target wasm32-unknown-unknown --locked

      - name: Check Cloudflare Worker example
        run: cargo check --target wasm32-unknown-unknown --locked
        working-directory: examples/cloudflare-worker

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Run benchmarks
        run: cargo bench --workspace --all-features --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  deny:
    name: Deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check

  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    # Only meaningful on PRs: the baseline is the PR's base branch.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the baseline commit is present locally.
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # Check the full public surface, not just default features, so
          # feature-gated API breakage is caught too.
          feature-group: all-features
          # Compare against the PR's merge base so changes within the current
          # release cycle are checked before publication.
          baseline-rev: ${{ github.event.pull_request.base.sha }}
