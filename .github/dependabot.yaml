version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /examples/cloudflare-worker
    schedule:
      interval: daily
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
